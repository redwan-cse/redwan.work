name: Integrated foundation smoke
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: integrated-foundation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  smoke:
    name: Foundation / integrated smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_SITE_URL: https://example.test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 4e9ca493fd6cdd11a82be742670455b752ca4c95
          path: _foundation-source
          persist-credentials: false
      - name: Copy reviewed tests only, never old application code
        run: |
          set -euo pipefail
          mkdir -p tests/server tests/browser
          cp _foundation-source/tests/bearer.test.mjs tests/bearer.test.mjs
          cp _foundation-source/tests/server/production-smoke.test.mjs tests/server/production-smoke.test.mjs
          cp _foundation-source/tests/browser/auth-screens.test.mjs tests/browser/auth-screens.test.mjs
          rm -rf _foundation-source
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.1'
          cache: npm
      - run: npm ci
      - name: Verify full locked dependency audit
        run: |
          # dependency-audit-report:start
          node <<'NODE'
          const {spawnSync} = require('node:child_process');
          const {readFileSync} = require('node:fs');
          const emit = (level, message) => console.log(`::${level} title=Locked dependency audit::${message.replace(/%/g, '%25').replace(/\r/g, '%0D').replace(/\n/g, '%0A')}`);
          const fail = category => {emit('error', category);process.exit(1);};
          const pkg = value => typeof value === 'string' && /^(?:@[a-z0-9._-]+\/)?[a-z0-9._-]+$/.test(value) && value.length <= 214 ? value : 'unknown';
          const version = value => typeof value === 'string' && /^\d+\.\d+\.\d+(?:[-+][A-Za-z0-9.-]+)?$/.test(value) && value.length <= 80 ? value : 'unknown';
          const range = value => typeof value === 'string' && /^[0-9A-Za-z.*<>=~^|+ -]{1,160}$/.test(value) ? value : 'unknown';
          let lock;
          try {lock = JSON.parse(readFileSync('package-lock.json', 'utf8'));if (!lock?.packages) throw new Error();}
          catch {fail('invalid-lockfile');}
          const result = spawnSync('npm', ['audit', '--json', '--audit-level=low'], {encoding: 'utf8', timeout: 120000, maxBuffer: 10 * 1024 * 1024});
          if (result.error || result.signal || !Number.isInteger(result.status)) fail('execution-failed');
          let report;
          try {report = JSON.parse(result.stdout);} catch {fail('invalid-report');}
          if (report?.error) {
            const code = typeof report.error.code === 'string' && /^E[A-Z_0-9]{1,30}$/.test(report.error.code) ? report.error.code : 'unknown';
            fail(`registry-or-audit-error code=${code}`);
          }
          const counts = report?.metadata?.vulnerabilities;
          const severities = ['info', 'low', 'moderate', 'high', 'critical'];
          if (report?.auditReportVersion !== 2 || !report.vulnerabilities || Array.isArray(report.vulnerabilities) || !counts ||
              ![...severities, 'total'].every(key => Number.isSafeInteger(counts[key]) && counts[key] >= 0)) fail('invalid-report');
          const entries = Object.entries(report.vulnerabilities);
          if (severities.reduce((sum, key) => sum + counts[key], 0) !== counts.total || entries.length !== counts.total ||
              entries.some(([, item]) => !item || !severities.includes(item.severity))) fail('invalid-report');
          const blocking = severities.slice(1).some(key => counts[key] > 0);
          emit(blocking || result.status !== 0 ? 'error' : 'notice', `total=${counts.total} ${severities.map(key => `${key}=${counts[key]}`).join(' ')} npmExit=${result.status}`);
          for (const [name, item] of entries.slice(0, 40)) {
            const nodes = Array.isArray(item.nodes) ? item.nodes : [];
            const installed = [...new Set(nodes.slice(0, 20).map(node => version(lock.packages[node]?.version)))].join(',') || 'unknown';
            const via = Array.isArray(item.via) ? item.via : [];
            const advisories = via.slice(0, 20).map(value => typeof value === 'object' && value !== null ?
              (typeof value.url === 'string' && /^https:\/\/github\.com\/advisories\/GHSA-[a-z0-9]{4}-[a-z0-9]{4}-[a-z0-9]{4}$/.test(value.url) ? value.url.split('/').pop() : 'unknown') : pkg(value)).join(',') || 'unknown';
            const fix = item.fixAvailable;
            const recommendation = fix && typeof fix === 'object' ? `${pkg(fix.name)}@${version(fix.version)} major=${fix.isSemVerMajor === true}` : fix === true ? 'available' : 'unavailable';
            const effects = Array.isArray(item.effects) ? item.effects.slice(0, 20).map(pkg).join(',') : 'unknown';
            emit(item.severity === 'info' ? 'notice' : 'error', `package=${pkg(name)} severity=${item.severity} direct=${item.isDirect === true} installed=${installed} range=${range(item.range)} via=${advisories} fix=${recommendation} effects=${effects}`);
          }
          if (entries.length > 40) emit('notice', `additional-findings-omitted=${entries.length - 40}`);
          process.exit(result.status !== 0 ? result.status : blocking ? 1 : 0);
          NODE
          # dependency-audit-report:end
      - name: Exact bearer contract
        run: node --experimental-strip-types --test tests/bearer.test.mjs
      - name: Build integrated app without provider credentials
        run: npm run build
      - name: Built server and security-header smoke
        run: node --test tests/server/production-smoke.test.mjs
      - name: Install isolated Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/foundation-browser" --ignore-scripts --no-audit --no-fund --save-exact playwright@1.58.2
          node "$RUNNER_TEMP/foundation-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Real desktop and mobile auth-screen smoke
        env:
          BROWSER_TOOLS_DIR: ${{ runner.temp }}/foundation-browser
        run: node --test tests/browser/auth-screens.test.mjs
