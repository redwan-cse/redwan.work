name: Bounded CSS dependency repair
on:
  push:
    branches: [feat/profile-password-change]
    paths: [.github/workflows/css-dependency-repair.yml]
permissions:
  contents: read
concurrency:
  group: css-dependency-repair-pr63
  cancel-in-progress: false
jobs:
  prepare:
    if: >-
      github.repository == 'redwan-cse/redwan.work' &&
      github.event.before == '3e5d4bb79bd6d94cae43d0f9b6c2ec1c164394bb' &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      payload_sha: ${{ steps.proof.outputs.payload_sha }}
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_SITE_URL: https://example.test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.1'
      - name: Prove intended red, official artifacts, narrow lock, and identical CSS
        id: proof
        run: |
          node <<'NODE'
          const assert=require('node:assert/strict');
          const fs=require('node:fs'),path=require('node:path'),cp=require('node:child_process'),crypto=require('node:crypto');
          const root=process.cwd(),dir=path.join(process.env.RUNNER_TEMP,'css-repair-pr63');
          const targets={'source-map-js':'1.2.2','postcss-selector-parser':'7.1.6'};
          const emit=message=>console.log(`::notice title=CSS repair::${message}`);
          const sha=bytes=>crypto.createHash('sha256').update(bytes).digest('hex');
          const blob=bytes=>crypto.createHash('sha1').update(`blob ${bytes.length}\0`).update(bytes).digest('hex');
          const json=file=>JSON.parse(fs.readFileSync(file,'utf8'));
          const run=(command,args,cwd=root,timeout=120000)=>{
            const result=cp.spawnSync(command,args,{cwd,encoding:'utf8',timeout,maxBuffer:8*1024*1024});
            assert.ok(!result.error&&!result.signal&&result.status===0,'ERR_CSS_COMMAND');
            return result.stdout;
          };
          async function main(){
            assert.equal(process.version,'v22.23.1');
            assert.equal(run('git',['rev-parse','HEAD']).trim(),process.env.GITHUB_SHA);
            assert.equal(run('git',['rev-parse','HEAD^']).trim(),'3e5d4bb79bd6d94cae43d0f9b6c2ec1c164394bb');
            assert.deepEqual(run('git',['diff','--name-only','HEAD^','HEAD']).trim().split('\n').sort(),[
              '.github/workflows/css-dependency-repair.yml','tests/reliability/dependency-audit.test.mjs',
            ]);
            const originalManifest=fs.readFileSync('package.json'),originalLock=fs.readFileSync('package-lock.json');
            assert.equal(blob(originalManifest),'5b2dfe28a299338e312b567280aa82e95cb180d4');
            assert.equal(blob(originalLock),'fce5f9d3e0de5e9da85bc8b7d2ecb2bd4bae9317');
            const baseline=JSON.parse(originalLock),manifest=JSON.parse(originalManifest);
            assert.equal(baseline.lockfileVersion,3);
            fs.mkdirSync(dir,{recursive:false});
            run('npm',['ci','--ignore-scripts','--no-audit','--no-fund']);
            emit(`phase=baseline-installed packages=${Object.keys(baseline.packages).length}`);
            for(const [name,old] of Object.entries({'source-map-js':'1.2.1','postcss-selector-parser':'6.1.4'})){
              assert.equal(require(`${name}/package.json`).version,old);
            }
            const tests=[
              ['CSS security rejects excessive indexed source-map offsets','ERR_SOURCE_OFFSET_REJECT'],
              ['CSS security bounds flat-selector membership work','ERR_SELECTOR_QUADRATIC'],
            ];
            for(const [name,marker] of tests){
              const r=cp.spawnSync(process.execPath,['--test','--test-reporter=tap',`--test-name-pattern=^${name}$`,'tests/reliability/dependency-audit.test.mjs'],{
                cwd:root,encoding:'utf8',timeout:30000,maxBuffer:1024*1024,
              });
              assert.ok(!r.error&&!r.signal&&r.status===1,'ERR_RED_EXECUTION');
              assert.ok(r.stdout.includes(marker)&&/# fail 1\b/.test(r.stdout)&&!r.stdout.includes('ERR_CSS_PROBE_SETUP')&&!r.stdout.includes('ERR_CSS_PROBE_EXECUTION'),'ERR_RED_REASON');
              emit(`phase=intended-red outcome=${marker}`);
            }
            const cssProgram=String.raw`
              const fs=require('node:fs'),path=require('node:path'),assert=require('node:assert/strict');
              const req=require('node:module').createRequire(path.join(process.cwd(),'package.json'));
              const postcss=req('postcss'),tailwind=req('tailwindcss'),autoprefixer=req('autoprefixer'),nested=req('postcss-nested');
              const config=req('tailwindcss/loadConfig')(path.resolve('tailwind.config.ts'));
              (async()=>{
                const app=await postcss([tailwind(config),autoprefixer]).process(fs.readFileSync('app/globals.css','utf8'),{
                  from:path.resolve('app/globals.css'),to:path.resolve('css-proof.out.css'),map:{inline:false},
                });
                const raw='sm:block dark:bg-background focus-visible:ring-2 group-hover:text-primary peer-checked:block [&>span]:text-sm data-[state=open]:animate-in animate-in fade-in slide-in-from-right animate-accordion-down';
                const fixture=await postcss([tailwind({...config,content:[{raw,extension:'html'}]}),autoprefixer]).process('@tailwind utilities;',{
                  from:'fixture.css',to:'fixture.out.css',map:{inline:false},
                });
                for(const atom of ['sm\\:block','group-hover','peer-checked','data-','animate-in','accordion-down','focus-visible'])assert.ok(fixture.css.includes(atom),'ERR_CSS_FIXTURE_EMPTY');
                const nesting=await postcss([nested]).process('.a, .b { &:hover { color:red } .child { color:blue } @media (min-width:640px) { & > span { display:block } } }',{
                  from:'nested.css',to:'nested.out.css',map:{inline:false},
                });
                assert.ok(app.css.length>1000&&app.map.toJSON().mappings.length>0);
                fs.writeFileSync(process.argv[2],JSON.stringify({
                  app:app.css,appMap:app.map.toJSON(),fixture:fixture.css,fixtureMap:fixture.map.toJSON(),nesting:nesting.css,nestingMap:nesting.map.toJSON(),
                }));
              })().catch(()=>{console.error('ERR_CSS_COMPILE');process.exitCode=1;});
            `;
            const cssScript=path.join(dir,'css-proof.cjs');
            fs.writeFileSync(cssScript,cssProgram);
            run(process.execPath,[cssScript,path.join(dir,'baseline-css.json')],root,180000);
            emit('phase=baseline-css outcome=success');
            const fixture=path.join(dir,'official-packages');fs.mkdirSync(fixture);
            const artifacts={};
            for(const [name,version] of Object.entries(targets)){
              const metadata=JSON.parse(run('npm',['view',`${name}@${version}`,'--json']));
              assert.equal(metadata.name,name);assert.equal(metadata.version,version);
              assert.equal(metadata.dist.tarball,`https://registry.npmjs.org/${name}/-/${name}-${version}.tgz`);
              assert.match(metadata.dist.integrity,/^sha512-[A-Za-z0-9+/]+=*$/);
              for(const hook of ['preinstall','install','postinstall']) assert.ok(!metadata.scripts?.[hook],'ERR_LIFECYCLE');
              const packed=JSON.parse(run('npm',['pack',`${name}@${version}`,'--ignore-scripts','--json'],fixture));
              assert.equal(packed.length,1);
              assert.equal(packed[0].filename,`${name}-${version}.tgz`);
              const tar=path.join(fixture,packed[0].filename),bytes=fs.readFileSync(tar);
              assert.equal(`sha512-${crypto.createHash('sha512').update(bytes).digest('base64')}`,metadata.dist.integrity);
              assert.equal(packed[0].integrity,metadata.dist.integrity);
              const inspect=String.raw`
          import sys,tarfile,json,pathlib
          with tarfile.open(sys.argv[1],"r:gz") as t:
            members=t.getmembers()
            assert len(members)<1000 and sum(m.size for m in members)<10000000
            for m in members:
              p=pathlib.PurePosixPath(m.name)
              assert not p.is_absolute() and ".." not in p.parts and p.parts[0]=="package"
              assert m.isfile() or m.isdir()
            pkg=json.load(t.extractfile("package/package.json"))
            print(json.dumps(pkg))
          `;
              const pkg=JSON.parse(run('python3',['-c',inspect,tar]));
              assert.equal(pkg.name,name);assert.equal(pkg.version,version);
              assert.deepEqual(pkg.dependencies||{},name==='source-map-js'?{}:{cssesc:'^3.0.0','util-deprecate':'^1.0.2'});
              for(const hook of ['preinstall','install','postinstall'])assert.ok(!pkg.scripts?.[hook],'ERR_LIFECYCLE');
              artifacts[name]={version,integrity:metadata.dist.integrity,tarball:metadata.dist.tarball};
              emit(`phase=artifact name=${name} version=${version} integrity=${metadata.dist.integrity}`);
            }
            fs.writeFileSync(path.join(fixture,'package.json'),JSON.stringify({name:'css-security-proof',version:'1.0.0',private:true,dependencies:targets},null,2)+'\n');
            run('npm',['install','--ignore-scripts','--no-audit','--no-fund'],fixture);
            run('npm',['audit','signatures'],fixture);
            emit('phase=registry-signatures outcome=success');
            const generated=json(path.join(fixture,'package-lock.json')),candidate=structuredClone(baseline);
            let changed=0;
            for(const [key,item] of Object.entries(candidate.packages)){
              const name=Object.keys(targets).find(name=>key===`node_modules/${name}`||key.endsWith(`/node_modules/${name}`));
              if(!name)continue;
              const replacement=generated.packages[`node_modules/${name}`];
              assert.equal(replacement.version,targets[name]);assert.equal(replacement.integrity,artifacts[name].integrity);
              assert.equal(replacement.resolved,artifacts[name].tarball);assert.ok(!replacement.hasInstallScript);
              for(const field of ['version','resolved','integrity','license','engines','dependencies']){
                if(Object.hasOwn(replacement,field))item[field]=replacement[field];else delete item[field];
              }
              assert.ok(!item.hasInstallScript);changed++;
            }
            assert.ok(changed>=2);
            manifest.overrides={...manifest.overrides,...targets};
            assert.deepEqual(Object.keys(candidate.packages),Object.keys(baseline.packages));
            for(const [key,item] of Object.entries(baseline.packages)){
              if(!Object.keys(targets).some(name=>key===`node_modules/${name}`||key.endsWith(`/node_modules/${name}`)))assert.deepEqual(candidate.packages[key],item);
            }
            fs.writeFileSync('package.json',JSON.stringify(manifest,null,2)+'\n');
            fs.writeFileSync('package-lock.json',JSON.stringify(candidate,null,2)+'\n');
            const lockHash=sha(fs.readFileSync('package-lock.json')),manifestHash=sha(fs.readFileSync('package.json'));
            run('npm',['ci','--ignore-scripts','--no-audit','--no-fund']);
            assert.equal(sha(fs.readFileSync('package-lock.json')),lockHash);assert.equal(sha(fs.readFileSync('package.json')),manifestHash);
            for(const [name,version] of Object.entries(targets)){
              const installed=json(path.join(root,'node_modules',name,'package.json'));
              assert.equal(installed.version,version);
              for(const hook of ['preinstall','install','postinstall'])assert.ok(!installed.scripts?.[hook]);
            }
            run(process.execPath,['--test','tests/reliability/dependency-audit.test.mjs'],root,120000);
            emit('phase=dependency-regressions outcome=success');
            run('npm',['audit','--audit-level=low']);
            emit('phase=full-low-threshold-audit outcome=success');
            run(process.execPath,[cssScript,path.join(dir,'candidate-css.json')],root,180000);
            const before=json(path.join(dir,'baseline-css.json')),after=json(path.join(dir,'candidate-css.json'));
            assert.deepEqual(after,before,'ERR_CSS_DIFFERENCE');
            emit(`phase=css-equivalence outcome=byte-identical app_sha256=${sha(before.app)} fixture_sha256=${sha(before.fixture)} nesting_sha256=${sha(before.nesting)}`);
            assert.deepEqual(run('git',['diff','--name-only']).trim().split('\n').sort(),['package-lock.json','package.json']);
            const payload={
              parent:process.env.GITHUB_SHA,base:'a86b2934556af04c74279d00ad1b0dbde3d81ec6',artifacts,
              files:{'package.json':fs.readFileSync('package.json','utf8'),'package-lock.json':fs.readFileSync('package-lock.json','utf8')},
            };
            const bytes=Buffer.from(JSON.stringify(payload));
            assert.ok(bytes.length<2000000);
            fs.writeFileSync(path.join(dir,'payload.json'),bytes);
            fs.appendFileSync(process.env.GITHUB_OUTPUT,`payload_sha=${sha(bytes)}\n`);
            emit(`phase=prepared outcome=success changed_lock_entries=${changed} payload_sha256=${sha(bytes)}`);
          }
          main().catch(error=>{
            const marker=String(error.message).match(/ERR_[A-Z_]+/)?.[0]||'ERR_CSS_PREPARATION';
            console.log(`::error title=CSS repair::${marker}`);process.exitCode=1;
          });
          NODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: css-repair-payload
          path: ${{ runner.temp }}/css-repair-pr63/payload.json
          if-no-files-found: error
          retention-days: 7
      - name: Remove only this job's temporary preparation fixtures
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/css-repair-pr63"
  publish:
    needs: prepare
    if: >-
      needs.prepare.result == 'success' &&
      github.repository == 'redwan-cse/redwan.work' &&
      github.ref == 'refs/heads/feat/profile-password-change' &&
      github.event.before == '3e5d4bb79bd6d94cae43d0f9b6c2ec1c164394bb' &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: css-repair-payload
          path: ${{ runner.temp }}/css-publish-pr63
      - name: Validate inert two-file data and publish only to the expected development parent
        env:
          REPAIR_TOKEN: ${{ github.token }}
          PAYLOAD_SHA: ${{ needs.prepare.outputs.payload_sha }}
        run: |
          node <<'NODE'
          const assert=require('node:assert/strict'),fs=require('node:fs'),path=require('node:path'),crypto=require('node:crypto');
          const repo='redwan-cse/redwan.work',branch='feat/profile-password-change';
          const base='a86b2934556af04c74279d00ad1b0dbde3d81ec6',parent=process.env.GITHUB_SHA;
          const targets={'source-map-js':'1.2.2','postcss-selector-parser':'7.1.6'};
          const api=async(endpoint,method='GET',body)=>{
            const response=await fetch(`https://api.github.com/repos/${repo}/${endpoint}`,{
              method,headers:{Authorization:`Bearer ${process.env.REPAIR_TOKEN}`,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'},
              ...(body?{body:JSON.stringify(body)}:{}),signal:AbortSignal.timeout(20000),
            });
            assert.ok(response.ok,'ERR_PUBLISH_API');return response.json();
          };
          const sha=bytes=>crypto.createHash('sha256').update(bytes).digest('hex');
          const gitBlob=bytes=>crypto.createHash('sha1').update(`blob ${Buffer.byteLength(bytes)}\0`).update(bytes).digest('hex');
          async function main(){
            assert.equal(process.env.GITHUB_REPOSITORY,repo);assert.equal(process.env.GITHUB_REF,`refs/heads/${branch}`);
            assert.match(parent,/^[0-9a-f]{40}$/);
            const location=path.join(process.env.RUNNER_TEMP,'css-publish-pr63');
            assert.deepEqual(fs.readdirSync(location),['payload.json']);
            const file=path.join(location,'payload.json'),stat=fs.lstatSync(file);
            assert.ok(stat.isFile()&&!stat.isSymbolicLink()&&stat.size<2000000);
            const bytes=fs.readFileSync(file);assert.equal(sha(bytes),process.env.PAYLOAD_SHA);
            const payload=JSON.parse(bytes);
            assert.deepEqual(Object.keys(payload).sort(),['artifacts','base','files','parent']);
            assert.equal(payload.parent,parent);assert.equal(payload.base,base);
            assert.deepEqual(Object.keys(payload.files).sort(),['package-lock.json','package.json']);
            const pr=await api('pulls/63');
            assert.equal(pr.state,'open');assert.equal(pr.draft,true);assert.equal(pr.merged,false);
            assert.equal(pr.head.repo.full_name,repo);assert.equal(pr.head.ref,branch);assert.equal(pr.head.sha,parent);
            assert.equal(pr.base.ref,'main');assert.equal(pr.base.sha,base);
            assert.equal((await api('git/ref/heads/main')).object.sha,base);
            assert.equal((await api(`git/ref/heads/${branch}`)).object.sha,parent);
            const commit=await api(`git/commits/${parent}`);
            assert.deepEqual(commit.parents.map(p=>p.sha),['3e5d4bb79bd6d94cae43d0f9b6c2ec1c164394bb']);
            const originals={};
            for(const [name,expected] of Object.entries({'package.json':'5b2dfe28a299338e312b567280aa82e95cb180d4','package-lock.json':'fce5f9d3e0de5e9da85bc8b7d2ecb2bd4bae9317'})){
              const item=await api(`contents/${name}?ref=${parent}`);assert.equal(item.sha,expected);
              originals[name]=JSON.parse(Buffer.from(item.content,'base64'));
              assert.equal(typeof payload.files[name],'string');
            }
            const oldManifest=originals['package.json'],newManifest=JSON.parse(payload.files['package.json']);
            assert.deepEqual(newManifest,{...oldManifest,overrides:{...oldManifest.overrides,...targets}});
            const oldLock=originals['package-lock.json'],newLock=JSON.parse(payload.files['package-lock.json']);
            assert.deepEqual(Object.keys(newLock.packages).sort(),Object.keys(oldLock.packages).sort());
            assert.deepEqual({...newLock,packages:{}},{...oldLock,packages:{}});
            assert.deepEqual(Object.keys(payload.artifacts).sort(),Object.keys(targets).sort());
            let changed=0;
            for(const [key,old] of Object.entries(oldLock.packages)){
              const item=newLock.packages[key],name=Object.keys(targets).find(n=>key===`node_modules/${n}`||key.endsWith(`/node_modules/${n}`));
              if(!name){assert.deepEqual(item,old);continue;}
              assert.deepEqual(Object.keys(payload.artifacts[name]).sort(),['integrity','tarball','version']);
              const receipt=payload.artifacts[name],version=targets[name];
              assert.equal(receipt.version,version);assert.equal(receipt.tarball,`https://registry.npmjs.org/${name}/-/${name}-${version}.tgz`);
              assert.match(receipt.integrity,/^sha512-[A-Za-z0-9+/]+=*$/);
              assert.equal(item.version,version);assert.equal(item.resolved,receipt.tarball);assert.equal(item.integrity,receipt.integrity);
              assert.deepEqual(item.dependencies||{},name==='source-map-js'?{}:{cssesc:'^3.0.0','util-deprecate':'^1.0.2'});
              assert.equal(item.license,name==='source-map-js'?'BSD-3-Clause':'MIT');
              assert.equal(item.engines.node,name==='source-map-js'?'>=0.10.0':'>=4');
              const permitted=new Set(['version','resolved','integrity','license','engines','dependencies']);
              for(const field of new Set([...Object.keys(old),...Object.keys(item)]))if(!permitted.has(field))assert.deepEqual(item[field],old[field]);
              assert.ok(!item.hasInstallScript);changed++;
            }
            assert.ok(changed>=2);
            const entries=[];
            for(const [name,content] of Object.entries(payload.files)){
              const created=await api('git/blobs','POST',{content,encoding:'utf-8'});
              assert.equal(created.sha,gitBlob(content));
              entries.push({path:name,mode:'100644',type:'blob',sha:created.sha});
            }
            const tree=await api('git/trees','POST',{base_tree:commit.tree.sha,tree:entries});
            const published=await api('git/commits','POST',{
              message:'fix(deps): pin official CSS parser and source-map security releases',
              tree:tree.sha,parents:[parent],
            });
            assert.equal((await api('git/ref/heads/main')).object.sha,base);
            assert.equal((await api(`git/ref/heads/${branch}`)).object.sha,parent);
            // Non-force update refuses divergent concurrent writes; this token cannot bypass protection.
            await api(`git/refs/heads/${branch}`,'PATCH',{sha:published.sha,force:false});
            assert.equal((await api(`git/ref/heads/${branch}`)).object.sha,published.sha);
            for(const entry of entries){
              const checked=await api(`contents/${entry.path}?ref=${published.sha}`);assert.equal(checked.sha,entry.sha);
            }
            console.log(`::notice title=CSS repair::phase=published commit=${published.sha} tree=${tree.sha} changed_lock_entries=${changed}`);
          }
          main().catch(()=>{console.log('::error title=CSS repair::ERR_PUBLISH_STOP');process.exitCode=1;});
          NODE
      - name: Remove only the downloaded inert payload
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/css-publish-pr63"
