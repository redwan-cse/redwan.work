name: Connect verified archive
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  connect:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/direct-public-asset-uploads'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - env:
          EDIT_TOKEN: ${{ github.token }}
        run: python3 scripts/connect-verified-archive.py
