name: Reliability verification
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: reliability-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Reliability / verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      statuses: write
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.1'
          cache: npm
      - name: Verify dependencies, tests, lint, types and build
        run: python3 tests/reliability/verify.py
      - name: Publish safe diagnostic summary
        if: always() && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          STATUS_TOKEN: ${{ github.token }}
          STATUS_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 tests/reliability/report.py
