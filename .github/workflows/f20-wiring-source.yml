name: Bounded F20 source integration
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  source:
    if: github.repository == 'redwan-cse/redwan.work' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/audit-followup-remediation'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Validate exact input and apply reviewed source transforms
        env:
          SOURCE_INPUT: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_INPUT"
          test "$(git rev-parse HEAD^)" = 'b0fee9a12caee8d4396b2c279a230e29652f22d4'
          test -z "$(git status --porcelain)"
          echo '2c2b8fe5b9a2d01edb57d9d89a5cfc759782f759d8a24500ec1d2726c49c6b55  scripts/f20-wire-source.py' | sha256sum --check
          python3 -I scripts/f20-wire-source.py > "$RUNNER_TEMP/f20-source-blobs.json"
          git diff --check
          node tests/contact-cleanup.mjs source
          node --check tests/audit-claim-challenges.mjs
          node --check tests/contact-cleanup.mjs
          node --check tests/wave-one-browser.mjs
          python3 - <<'PY'
          import json,os,pathlib,subprocess
          expected=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'f20-source-blobs.json').read_text())
          actual=subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()
          assert len(expected)==14 and set(actual)==set(expected)
          print('Verified 14 exact-input source edits; no production operation.')
          PY
      - name: Publish only the verified development source edits
        env:
          WRITE_TOKEN: ${{ github.token }}
          SOURCE_INPUT: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_INPUT"
          auth="$(printf 'x-access-token:%s' "$WRITE_TOKEN" | base64 -w0)"
          remote="$(git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" ls-remote origin refs/heads/fix/audit-followup-remediation | cut -f1)"
          test "$remote" = "$SOURCE_INPUT"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- components/enhanced-contact-form.tsx lib/contact/consent-policy.ts tests/reliability/consent-policy.test.mjs scripts/audit-manifests.mjs tests/reliability/contact.test.mjs tests/reliability/caller-inventory.test.mjs tests/reliability/intake-consent.test.mjs tests/acceptance/disposable-bootstrap.mjs tests/reliability/disposable-bootstrap.test.mjs tests/reliability/contact-pipeline.acceptance.mjs tests/wave-one-browser.mjs tests/audit-claim-challenges.mjs tests/contact-cleanup.mjs .github/workflows/contact-cleanup.yml
          git commit -m 'fix(contact): connect displayed consent version, stale recheck, and real intake acceptance'
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/fix/audit-followup-remediation
          echo 'Source integration published. This is not a full acceptance result.'
