name: Combined authenticated acceptance
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: combined-auth-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  auth:
    name: Combined / real Auth and mailbox
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      statuses: write
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 4e9ca493fd6cdd11a82be742670455b752ca4c95
          path: _acceptance-harness
          persist-credentials: false
      - name: Isolate reviewed harness
        run: |
          mkdir -p tests/auth
          cp _acceptance-harness/tests/auth/*.mjs tests/auth/
          cp _acceptance-harness/tests/auth/check-template.py tests/auth/
          rm -rf _acceptance-harness
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.1'
          cache: npm
      - name: Install pinned tools
        run: |
          set -euo pipefail
          npm ci
          npm install --prefix "$RUNNER_TEMP/auth-browser-tools" --ignore-scripts --no-audit --no-fund --save-exact playwright@1.58.2
          node "$RUNNER_TEMP/auth-browser-tools/node_modules/playwright/cli.js" install --with-deps chromium
          curl --fail --silent --show-error --location https://github.com/supabase/cli/releases/download/v2.116.0/supabase_2.116.0_linux_amd64.tar.gz -o "$RUNNER_TEMP/supabase.tar.gz"
          echo "5b3031cb297d51b25be4c284e4c852254460ec722ec221d3b81b07d55acfd158  $RUNNER_TEMP/supabase.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/auth-cli"
          tar -xzf "$RUNNER_TEMP/supabase.tar.gz" -C "$RUNNER_TEMP/auth-cli" supabase
      - name: Initialize disposable local project
        run: |
          set -euo pipefail
          stage=init
          trap 'echo "::error::Combined Auth setup failed at $stage"' ERR
          umask 077
          mkdir -p "$RUNNER_TEMP/redwan-auth-ci"
          "$RUNNER_TEMP/auth-cli/supabase" init --workdir "$RUNNER_TEMP/redwan-auth-ci" > "$RUNNER_TEMP/auth-init.log" 2>&1
          mkdir -p "$RUNNER_TEMP/redwan-auth-ci/supabase/migrations"
          cp supabase/migrations/*.sql "$RUNNER_TEMP/redwan-auth-ci/supabase/migrations/"
          stage=config
          python3 - <<'PY'
          import os,pathlib,re,tomllib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'redwan-auth-ci/supabase/config.toml'
          s,n=re.subn(r'^project_id = .*$', 'project_id = "redwan-auth-ci"',p.read_text(),flags=re.M)
          assert n==1
          s,n=re.subn(r'^site_url = .*$', 'site_url = "http://localhost:3399"',s,flags=re.M)
          assert n==1
          assert 'recovery' not in tomllib.loads(s).get('auth',{}).get('email',{}).get('template',{})
          template=p.parent/'recovery-ci.html'
          template.write_text('<h2>Reset your password</h2><p><a href="{{ .SiteURL }}/reset-password?token_hash={{ .TokenHash }}&amp;type=recovery">Reset password</a></p>')
          template.chmod(0o644)
          s+='\n[auth.email.template.recovery]\nsubject = "Disposable recovery acceptance"\ncontent_path = "./supabase/recovery-ci.html"\n'
          tomllib.loads(s);p.write_text(s)
          PY
          python3 tests/reliability/configure-auth-fixtures.py
          stage=start
          "$RUNNER_TEMP/auth-cli/supabase" start --workdir "$RUNNER_TEMP/redwan-auth-ci" > "$RUNNER_TEMP/auth-start.log" 2>&1
          "$RUNNER_TEMP/auth-cli/supabase" status --workdir "$RUNNER_TEMP/redwan-auth-ci" --output json > "$RUNNER_TEMP/auth-status.json" 2> "$RUNNER_TEMP/auth-status.log"
      - name: Verify Auth and recovery mailbox
        env:
          AUTH_STATUS_FILE: ${{ runner.temp }}/auth-status.json
          BROWSER_TOOLS_DIR: ${{ runner.temp }}/auth-browser-tools
        run: |
          set -euo pipefail
          python3 tests/auth/check-template.py
          node tests/auth/run-local.mjs
      - name: Verify product and full account lifecycle
        env:
          AUTH_STATUS_FILE: ${{ runner.temp }}/auth-status.json
          BROWSER_TOOLS_DIR: ${{ runner.temp }}/auth-browser-tools
        run: node tests/reliability/run-product-browser.mjs
      - name: Approved wave baseline reproduction and candidate browser-to-database acceptance
        env:
          AUTH_STATUS_FILE: ${{ runner.temp }}/auth-status.json
          BROWSER_TOOLS_DIR: ${{ runner.temp }}/auth-browser-tools
        run: node tests/wave-one-browser.mjs
      - name: Publish finite wave acceptance counts only
        if: always() && github.event.pull_request.head.repo.full_name == github.repository
        env:
          STATUS_TOKEN: ${{ github.token }}
          STATUS_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PY'
          import json,os,pathlib,re,urllib.request
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'wave-browser-result.json'
          r=json.loads(p.read_text()) if p.exists() else {}
          desc=[];ok=r.get('complete') is True
          for mode in ['baseline','candidate']:
            row=r.get(mode) or {};parts=[]
            for group in ['A01','I01','I02']:
              value=row.get(group) or {};passed=value.get('pass',0);failed=value.get('fail',0)
              assert type(passed) is int and type(failed) is int and 0<=passed<=100 and 0<=failed<=100
              parts.append(group+'='+str(passed)+'/'+str(failed))
              ok=ok and passed>0 and (failed>0 if mode=='baseline' else failed==0)
            phase=row.get('phase','unavailable')
            if phase not in ['startup','fixtures','build','server','A01','I01','I02']:phase='unavailable'
            desc.append(mode+':'+','.join(parts)+' '+phase)
          desc.append('cleanup='+str(bool(r.get('complete'))))
          sha=os.environ['STATUS_SHA'];assert re.fullmatch('[0-9a-f]{40}',sha)
          payload={'context':'wave-one/browser-db','state':'success' if ok else 'failure','description':'; '.join(desc)[:140],'target_url':'https://github.com/redwan-cse/redwan.work/actions/runs/'+os.environ['GITHUB_RUN_ID']}
          req=urllib.request.Request('https://api.github.com/repos/redwan-cse/redwan.work/statuses/'+sha,data=json.dumps(payload).encode(),headers={'Authorization':'Bearer '+os.environ['STATUS_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'},method='POST')
          try:
            with urllib.request.urlopen(req,timeout=15) as response:assert response.status==201
          except Exception:raise SystemExit('Safe acceptance status publication failed')
          print('; '.join(desc))
          PY
      - name: Destroy disposable services
        if: always()
        run: |
          set -euo pipefail
          if [ -x "$RUNNER_TEMP/auth-cli/supabase" ] && [ -f "$RUNNER_TEMP/redwan-auth-ci/supabase/config.toml" ]; then
            if ! "$RUNNER_TEMP/auth-cli/supabase" stop --workdir "$RUNNER_TEMP/redwan-auth-ci" --no-backup > "$RUNNER_TEMP/auth-stop.log" 2>&1; then
              echo '::error::Combined Auth teardown failed.'
              exit 1
            fi
          fi
