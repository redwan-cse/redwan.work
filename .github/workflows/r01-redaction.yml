name: R01 reachable error redaction
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  redaction:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.1'
          cache: npm
      - run: npm ci
      - run: docker pull node:22.23.1-bookworm-slim
      - name: Execute real modules with synthetic adapters, no network
        run: |
          mkdir -p "$RUNNER_TEMP/r01"
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges \
            --user "$(id -u):$(id -g)" --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            -v "$PWD:/work:ro" -v "$RUNNER_TEMP/r01:/results:rw" -w /work node:22.23.1-bookworm-slim \
            node --experimental-strip-types tests/r01-redaction.mjs /results/result.json
      - name: Publish finite results only
        if: always() && github.event.pull_request.head.repo.full_name == github.repository
        env:
          STATUS_TOKEN: ${{ github.token }}
          STATUS_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PY'
          import os,json,pathlib,re,urllib.request
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'r01/result.json';r=json.loads(p.read_text()) if p.exists() else {}
          assert all(re.fullmatch('[a-z-]+',k) and v in ['PASS','ASSERTION_FAIL','EXECUTION_FAIL'] for k,v in r.items())
          desc='cases='+str(len(r))+' pass='+str(list(r.values()).count('PASS'))+' assertion_fail='+str(list(r.values()).count('ASSERTION_FAIL'))+' execution_fail='+str(list(r.values()).count('EXECUTION_FAIL'))
          sha=os.environ['STATUS_SHA'];assert re.fullmatch('[0-9a-f]{40}',sha)
          payload={'context':'r01/redaction','state':'success' if len(r)==19 and all(v=='PASS' for v in r.values()) else 'failure','description':desc,'target_url':'https://github.com/redwan-cse/redwan.work/actions/runs/'+os.environ['GITHUB_RUN_ID']}
          req=urllib.request.Request('https://api.github.com/repos/redwan-cse/redwan.work/statuses/'+sha,data=json.dumps(payload).encode(),headers={'Authorization':'Bearer '+os.environ['STATUS_TOKEN'],'Content-Type':'application/json'},method='POST')
          try:
            with urllib.request.urlopen(req,timeout=15) as res:assert res.status==201
          except Exception:raise SystemExit('Safe redaction reporting unavailable')
          print(desc)
          PY
