name: Semgrep
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 0 * * 0'
permissions:
  contents: read
jobs:
  semgrep:
    name: Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: semgrep/semgrep@sha256:12672acdb0949e19f9f6a4c2b288edd0b404f268f0ca7738a2c06f372f50362e # 1.176.0 OCI index
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Run Semgrep scan
        id: scan
        continue-on-error: true
        run: semgrep scan --config auto --sarif --output semgrep.sarif --error
      - name: Upload SARIF even when findings are present
        if: always()
        uses: github/codeql-action/upload-sarif@6f5948dfacef28e207b48d0905cf90c03365536d
        with:
          sarif_file: semgrep.sarif
          category: semgrep
      - name: Enforce scan outcome
        if: always()
        env:
          SCAN_OUTCOME: ${{ steps.scan.outcome }}
        run: |
          if [ "$SCAN_OUTCOME" != success ]; then
            echo '::error::Semgrep reported findings or failed to complete. Review the uploaded annotations; this gate is not bypassed.'
            exit 1
          fi
