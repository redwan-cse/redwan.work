name: Approved Auth origin and recovery correction
on:
  push:
    branches: [fix/direct-public-asset-uploads]
    paths: [.github/workflows/auth-origin-fix.yml]
permissions:
  contents: read
  statuses: write
concurrency:
  group: production-auth-two-field-correction
  cancel-in-progress: false
jobs:
  correct:
    if: github.repository == 'redwan-cse/redwan.work' && github.ref == 'refs/heads/fix/direct-public-asset-uploads' && github.run_attempt == 1 && github.event.head_commit.message == 'ci(auth): apply approved two-field production correction once'
    environment: Production
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 296ed616abdb0d43e81d32fa0ff2caed472862a6
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.1
      - name: Verify scoped change and rollback using synthetic configuration
        run: node --test scripts/auth-origin-fix.test.mjs
      - name: Apply only owner-approved Auth origin and recovery link
        env:
          APPROVED_AUTH_FIELDS: site_url,mailer_templates_recovery_content
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          NODE_OPTIONS: ''
        run: node scripts/auth-origin-fix.mjs apply
      - name: Publish only fixed outcome without production credentials
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NODE_OPTIONS: ''
        run: node scripts/auth-origin-fix.mjs report
      - name: Remove private temporary rollback and finite result files
        if: always()
        run: rm -f -- "$RUNNER_TEMP/auth-fix-rollback.json" "$RUNNER_TEMP/auth-fix-result.json"
