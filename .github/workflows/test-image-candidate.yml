name: Disposable storage image candidate verification
on:
  push:
    branches: [fix/direct-public-asset-uploads]
    paths: [.github/workflows/test-image-candidate.yml, tests/storage-image-candidate.mjs]
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Verify immutable public image signature before application tools
        run: |
          python3 - <<'PY'
          import os,pathlib,urllib.request,json,hashlib,subprocess,re
          root=pathlib.Path(os.environ['RUNNER_TEMP']);report={'signature':False,'phase':'verifier-download'}
          try:
            with urllib.request.urlopen('https://api.github.com/repos/sigstore/cosign/releases/tags/v3.1.3',timeout=30) as r:release=json.load(r)
            a=next(a for a in release['assets'] if a['name']=='cosign-linux-amd64');digest=a['digest'];assert re.fullmatch('sha256:[0-9a-f]{64}',digest)
            url=a['browser_download_url'];assert url=='https://github.com/sigstore/cosign/releases/download/v3.1.3/cosign-linux-amd64'
            with urllib.request.urlopen(url,timeout=60) as r:data=r.read()
            assert 'sha256:'+hashlib.sha256(data).hexdigest()==digest
            binary=root/'cosign';binary.write_bytes(data);binary.chmod(0o700);report['phase']='signature'
            image='cgr.dev/chainguard/minio@sha256:039800e64ec7247d2fde7cff3697e964f6fe20b6d7d2c46aa7d82cc63355d512'
            r=subprocess.run([str(binary),'verify','--certificate-oidc-issuer=https://token.actions.githubusercontent.com','--certificate-identity=https://github.com/chainguard-images/images/.github/workflows/release.yaml@refs/heads/main',image],stdout=subprocess.PIPE,stderr=subprocess.PIPE,text=True,timeout=120)
            report['signature']=r.returncode==0
            if report['signature']:report['phase']='verified'
            else:
              text=r.stderr.lower();report['reason']='identity-mismatch' if 'expected' in text or 'identity' in text else 'signature-verification-failed'
          except Exception:report['reason']='verification-unavailable'
          (root/'candidate-signature.json').write_text(json.dumps(report))
          print('Signature verification phase='+report['phase'])
          if not report['signature']:raise SystemExit(1)
          PY
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.1'
          cache: npm
      - run: npm ci
      - name: Exercise immutable image through actual SDK signed PUT HEAD GET list and delete
        run: node tests/storage-image-candidate.mjs
      - name: Publish fixed verification outcomes
        if: always()
        env:
          STATUS_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os,pathlib,json,re,urllib.request
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          s=json.loads((root/'candidate-signature.json').read_text()) if (root/'candidate-signature.json').exists() else {}
          r=json.loads((root/'candidate-storage.json').read_text()) if (root/'candidate-storage.json').exists() else {}
          ok=s.get('signature') is True and r.get('passed') is True and r.get('cleanup') is True
          text='signature='+str(s.get('signature') is True)+' storage='+str(r.get('passed') is True)+' cleanup='+str(r.get('cleanup') is True)
          phase=r.get('phase',s.get('phase','unavailable'));assert re.fullmatch('[a-z-]{1,40}',phase)
          text+=' phase='+phase
          sha=os.environ['GITHUB_SHA'];assert re.fullmatch('[0-9a-f]{40}',sha)
          payload={'context':'test-image/verified','state':'success' if ok else 'failure','description':text,'target_url':'https://github.com/redwan-cse/redwan.work/actions/runs/'+os.environ['GITHUB_RUN_ID']}
          req=urllib.request.Request('https://api.github.com/repos/redwan-cse/redwan.work/statuses/'+sha,data=json.dumps(payload).encode(),headers={'Authorization':'Bearer '+os.environ['STATUS_TOKEN'],'Content-Type':'application/json'},method='POST')
          try:
            with urllib.request.urlopen(req,timeout=15) as response:assert response.status==201
          except Exception:raise SystemExit('Safe verification report unavailable')
          print(text)
          PY
