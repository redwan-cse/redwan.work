name: Auth diagnosis (GET only)
on:
  push:
    branches: [fix/direct-public-asset-uploads]
    paths: [.github/workflows/auth-readonly-diagnosis.yml]
permissions:
  contents: read
  statuses: write
concurrency:
  group: auth-readonly-diagnosis
  cancel-in-progress: false
jobs:
  read-only:
    if: >-
      github.repository == 'redwan-cse/redwan.work' && github.ref == 'refs/heads/fix/direct-public-asset-uploads' && github.run_attempt == 1
    environment: Production
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 9f8b672c97ac545af989b4469f56f66b64992699
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.1
      - name: Test read-only boundaries without credentials
        run: node scripts/auth-readonly-diagnosis.mjs test
      - name: Read Auth configuration twice without writing
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          NODE_OPTIONS: ''
        run: node scripts/auth-readonly-diagnosis.mjs read
      - name: Report only finite evidence categories
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NODE_OPTIONS: ''
        run: node scripts/auth-readonly-diagnosis.mjs report
      - name: Remove finite temporary results
        if: always()
        run: rm -f -- "$RUNNER_TEMP/auth-readonly-result.json"
