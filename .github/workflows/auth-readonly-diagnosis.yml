name: Auth diagnosis (retired)
on:
  push:
    branches: [fix/direct-public-asset-uploads]
    paths: [.github/workflows/auth-readonly-diagnosis.yml, scripts/auth-readonly-diagnosis.mjs]
permissions:
  contents: read
jobs:
  retired:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.1
      - run: node scripts/auth-readonly-diagnosis.mjs
