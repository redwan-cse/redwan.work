name: Approved wave-one contracts
on:
  push:
    branches: [fix/direct-public-asset-uploads]
    paths: [tests/wave-one.test.mjs, .github/workflows/wave-one.yml, lib/auth/actions.ts, lib/contact/lead-schema.ts, lib/contact/intake-contract.ts]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: wave-one-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.1'
          cache: npm
      - name: Install locked dependencies without provider credentials
        run: npm ci
      - name: Prepare isolated Node runtime
        run: docker pull node:22.23.1-bookworm-slim
      - name: Actual action and parser contracts, network disabled
        run: |
          set +e
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --user "$(id -u):$(id -g)" \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            -v "$PWD:/work:ro" -w /work node:22.23.1-bookworm-slim \
            node --experimental-strip-types --test tests/wave-one.test.mjs > "$RUNNER_TEMP/wave-one.tap" 2>&1
          code=$?
          printf '%s' "$code" > "$RUNNER_TEMP/wave-one.exit"
          grep -E '^# (tests|pass|fail|cancelled|skipped) [0-9]+$' "$RUNNER_TEMP/wave-one.tap" || true
          exit "$code"
      - name: Report only assertion counts, never raw diagnostics
        if: always() && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          STATUS_TOKEN: ${{ github.token }}
          STATUS_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 - <<'PY'
          import json,os,pathlib,re,urllib.request
          p=pathlib.Path(os.environ['RUNNER_TEMP'])
          tap=(p/'wave-one.tap').read_text() if (p/'wave-one.tap').exists() else ''
          code=(p/'wave-one.exit').read_text() if (p/'wave-one.exit').exists() else 'missing'
          counts={k:re.findall(r'^# '+k+r' (\d+)$',tap,re.M) for k in ['tests','pass','fail']}
          details=' '.join(k+'='+(v[-1] if v else '?') for k,v in counts.items())
          groups={k:len(re.findall(r'^not ok \d+ - '+k+r' ',tap,re.M)) for k in ['A01','I01','I02']}
          details+=' failed:'+','.join(k+'='+str(v) for k,v in groups.items())
          details+=' assertions='+str(tap.count("code: 'ERR_ASSERTION'"))
          sha=os.environ['STATUS_SHA'];assert re.fullmatch('[0-9a-f]{40}',sha)
          assert os.environ['GITHUB_REPOSITORY']=='redwan-cse/redwan.work'
          payload={'context':'wave-one/contracts','state':'success' if code=='0' else 'failure','description':details[:140],'target_url':'https://github.com/redwan-cse/redwan.work/actions/runs/'+os.environ['GITHUB_RUN_ID']}
          req=urllib.request.Request('https://api.github.com/repos/redwan-cse/redwan.work/statuses/'+sha,data=json.dumps(payload).encode(),headers={'Authorization':'Bearer '+os.environ['STATUS_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'},method='POST')
          try:
            with urllib.request.urlopen(req,timeout=15) as response: assert response.status==201
          except Exception: raise SystemExit('Safe result publication failed; original test job remains authoritative')
          print(details)
          PY
