name: Configuration classification (read-only)
on:
  push:
    branches: [fix/direct-public-asset-uploads]
    paths: [.github/workflows/config-classification.yml]
permissions:
  contents: read
  statuses: write
concurrency:
  group: configuration-classification
  cancel-in-progress: false
jobs:
  classify:
    if: github.repository == 'redwan-cse/redwan.work' && github.ref == 'refs/heads/fix/direct-public-asset-uploads'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: Production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 485d3565af68647faf148a60d7b317dee3640406
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.1
      - name: Synthetic confidentiality and request-boundary tests (no production credentials)
        run: node --test scripts/config-classification.test.mjs
      - name: Classify only authorized production metadata
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          NODE_OPTIONS: ''
        run: node scripts/config-classification.mjs production
      - name: Publish only finite categories and inspect signature metadata
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NODE_OPTIONS: ''
        run: node scripts/config-classification.mjs report
      - name: Remove finite result file
        if: always()
        run: rm -f -- "$RUNNER_TEMP/configuration-categories.json"
