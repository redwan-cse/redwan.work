name: Read-only review evidence
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  evidence:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/consent-diagnostic-contracts'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      checks: read
      security-events: read
      statuses: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Publish only safe inventory and acceptance summaries
        env:
          REVIEW_TOKEN: ${{ github.token }}
          REVIEW_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/review-evidence.py
