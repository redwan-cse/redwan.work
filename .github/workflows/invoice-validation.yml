name: Invoice validation
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: invoice-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_SITE_URL: https://example.test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.1'
          cache: npm
      - run: npm ci
      - name: Quantity regression tests
        run: node --experimental-strip-types --test tests/invoice-quantity.test.mjs
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: |
          npx --no-install next typegen
          npx --no-install tsc --noEmit
      - name: Build
        run: npm run build
