name: CI
on:
  push:
    branches: [main, 'audit/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  static:
    name: Static build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:9
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder_not_a_real_key
      SUPABASE_SECRET_KEY: sb_secret_ci_placeholder_not_a_real_key
      LEAD_IP_HASH_SALT: ci-only-placeholder-salt-not-used-for-real-people
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Record runtime
        run: node --version && npm --version
      - name: Install locked dependencies
        run: npm ci
      - name: Test the quality gate itself (not the application)
        run: node --test scripts/verify-quality-contract.test.mjs
      - name: Generate Next route types
        run: ./node_modules/.bin/next typegen
      - name: Typecheck
        run: npm run typecheck
      - name: Lint with no warnings
        run: npm run lint -- --max-warnings=0
      - name: Production build with synthetic configuration
        run: npm run build
